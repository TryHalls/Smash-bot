[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smashbot-android-diagnostics"
version = "0.1.0"
description = "Host-side diagnostics for the SMASH Android control and capture pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
perception = [
    "numpy==2.4.6",
    "opencv-python-headless==4.14.0.94",
]

[project.scripts]
smashbot-diagnostics = "smashbot_diagnostics.cli:main"

[tool.setuptools.packages.find]
include = ["smashbot_diagnostics*"]
